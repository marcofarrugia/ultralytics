# Ultralytics YOLO11 object detection model with quarter-width post-fusion PSA at P3/P4 and full-feature PSA at P5
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-psa-postfusion-p3p4quarter-p5full.yaml' uses scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 213 layers, 2963328 parameters, 2963312 gradients, 6.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 213 layers, 10807456 parameters, 10807440 gradients, 22.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 263 layers, 21358272 parameters, 21358256 gradients, 69.0 GFLOPs
  l: [1.00, 1.00, 512] # summary: 389 layers, 27875008 parameters, 27874992 gradients, 88.5 GFLOPs
  x: [1.00, 1.50, 512] # summary: 389 layers, 62585152 parameters, 62585136 gradients, 197.9 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSAFullFeatureFusion, [1024, "no_concat"]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2FusionBottleneckPSA, [256, False, 0.25]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2FusionBottleneckPSA, [512, False, 0.25]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
