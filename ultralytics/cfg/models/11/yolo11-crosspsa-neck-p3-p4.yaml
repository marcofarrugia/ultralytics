# YOLO11 detection model retaining global P5 C2PSA and adding CrossPSA refinement at neck P3 and P4
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-crosspsa-neck-p3-p4.yaml' selects scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 209 layers, 2662128 parameters, 2662112 gradients, 6.8 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 209 layers, 9606528 parameters, 9606512 gradients, 22.5 GFLOPs
  m: [0.50, 1.00, 512] # summary: 259 layers, 20696960 parameters, 20696944 gradients, 71.6 GFLOPs
  l: [1.00, 1.00, 512] # summary: 385 layers, 25954432 parameters, 25954416 gradients, 90.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 385 layers, 58269664 parameters, 58269648 gradients, 202.7 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10: unchanged global P5 attention

# YOLO11 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2CrossPSA, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2CrossPSA, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
