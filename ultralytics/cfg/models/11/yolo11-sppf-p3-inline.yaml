# Ultralytics YOLO11 object detection model with stock SPPF context aggregation at P3/8 and P5/32
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-sppf-p3-inline.yaml' selects scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 186 layers, 2634512 parameters, 2634496 gradients, 6.8 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 186 layers, 9500096 parameters, 9500080 gradients, 22.3 GFLOPs
  m: [0.50, 1.00, 512] # summary: 236 layers, 20279296 parameters, 20279280 gradients, 70.6 GFLOPs
  l: [1.00, 1.00, 512] # summary: 362 layers, 25536768 parameters, 25536752 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 362 layers, 57335968 parameters, 57335952 gradients, 200.7 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)
  - [-1, 1, SPPF, [256, 5]] # 17 (P3/8 inline SPPF)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
