# Ultralytics YOLO11 object detection model with a full P2/4 - P5/32 PAN path
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-p2-full-pan.yaml' will call this file with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 216 layers, 2806928 parameters, 2806912 gradients, 13.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 216 layers, 9957712 parameters, 9957696 gradients, 38.1 GFLOPs
  m: [0.50, 1.00, 512] # summary: 286 layers, 21875344 parameters, 21875328 gradients, 120.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 440 layers, 27560848 parameters, 27560832 gradients, 153.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 440 layers, 61861936 parameters, 61861920 gradients, 342.2 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 full-PAN P2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (top-down P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [256, False]] # 19 (P2/4-x-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat top-down P3
  - [-1, 2, C3k2, [256, False]] # 22 (PAN P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat top-down P4
  - [-1, 2, C3k2, [512, False]] # 25 (PAN P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 28 (PAN P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29: Detect(P2, P3, P4, P5)


# P2 initiates the bottom-up PAN path so its fine-resolution features propagate through P3, P4, and P5.
# P2 -> P3 -> P4 -> P5 -> Detect(P2, P3, P4, P5)
