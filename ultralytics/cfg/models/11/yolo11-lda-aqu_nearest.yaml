# Ultralytics YOLO11 object detection model using LDA-AQU with nearest-neighbor query interpolation and P3/8 - P5/32 outputs
# LDA-AQU: https://arxiv.org/abs/2411.19585
# Both LDA-AQU sites use nearest-neighbor query interpolation; deformable key/value sampling remains bilinear.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-lda-aqu_nearest.yaml' resolves to this YAML with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 193 layers, 2675012 parameters, 2674996 gradients, 6.8 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 193 layers, 9642500 parameters, 9642484 gradients, 22.1 GFLOPs
  m: [0.50, 1.00, 512] # summary: 243 layers, 20403364 parameters, 20403348 gradients, 69.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 369 layers, 25660836 parameters, 25660820 gradients, 88.5 GFLOPs
  x: [1.00, 1.50, 512] # summary: 369 layers, 57595780 parameters, 57595764 gradients, 197.7 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head
head:
  # Paper-tested LDA-AQU variant: nearest-neighbor query interpolation.
  - [-1, 1, LDAAQU, [4, 1, 2, 3, 3, 2, 11, True, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  # Paper-tested LDA-AQU variant: nearest-neighbor query interpolation.
  - [-1, 1, LDAAQU, [4, 1, 2, 3, 3, 2, 11, True, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
