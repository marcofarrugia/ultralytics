# Ultralytics YOLO11 object detection model using the LDA-AQU reduction-16 efficiency variant with bilinear query interpolation and P3/8 - P5/32 outputs
# LDA-AQU: https://arxiv.org/abs/2411.19585
# Both LDA-AQU sites use bilinear query interpolation; deformable key/value sampling remains bilinear.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-lda-aqu-r16_bilinear.yaml' resolves to this YAML with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 193 layers, 2637416 parameters, 2637400 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 193 layers, 9505868 parameters, 9505852 gradients, 21.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 243 layers, 20188420 parameters, 20188404 gradients, 68.7 GFLOPs
  l: [1.00, 1.00, 512] # summary: 369 layers, 25445892 parameters, 25445876 gradients, 87.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 369 layers, 57125908 parameters, 57125892 gradients, 196.4 GFLOPs

# YOLO11 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11 head
head:
  # LDA-AQU efficiency variant: reduction 16, bilinear query interpolation.
  - [-1, 1, LDAAQU, [16, 1, 2, 3, 3, 2, 11, True, "bilinear"]] # [reduction_factor, num_heads, scale_factor, encoder_kernel, up_kernel, offset_groups, range_factor, rpb, query_mode]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  # LDA-AQU efficiency variant: reduction 16, bilinear query interpolation.
  - [-1, 1, LDAAQU, [16, 1, 2, 3, 3, 2, 11, True, "bilinear"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
