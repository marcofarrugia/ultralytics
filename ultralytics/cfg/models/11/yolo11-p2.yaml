# Ultralytics YOLO11 object detection model with P2/4 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-p2.yaml' will call yolo11-p2.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 205 layers, 2746032 parameters, 2746016 gradients, 12.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 205 layers, 9715088 parameters, 9715072 gradients, 34.9 GFLOPs
  m: [0.50, 1.00, 512] # summary: 265 layers, 20873360 parameters, 20873344 gradients, 107.6 GFLOPs
  l: [1.00, 1.00, 512] # summary: 405 layers, 26344848 parameters, 26344832 gradients, 137.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 405 layers, 59128624 parameters, 59128608 gradients, 307.1 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n-p2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23: neck P3/8 to P2/4
  - [[-1, 2], 1, Concat, [1]] # 24: cat deepest backbone P2
  - [-1, 2, C3k2, [256, False]] # 25: (P2/4-x-small)

  - [[25, 16, 19, 22], 1, Detect, [nc]] # 26: Detect(P2, P3, P4, P5)


# P2 does not feed back into the bottom-up PAN path. P3, P4, and P5 remain exactly as in the baseline.
# Downsampling P2 into a newly reconstructed P3, then P4 and P5, would be a broader neck redesign and would no longer preserve the baseline P3–P5 paths.

# P2 ────────────────→ Detect
# P3 → P4 → P5 ──────→ Detect
