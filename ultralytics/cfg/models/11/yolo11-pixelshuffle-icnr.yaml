# Ultralytics YOLO11 object detection model with depthwise-separable Pixel Shuffle ICNR upsampling
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-pixelshuffle-icnr.yaml' will call this YAML with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 185 layers, 2955216 parameters, 2955200 gradients, 7.036838 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 185 layers, 10776384 parameters, 10776368 gradients, 23.402240 GFLOPs
  m: [0.50, 1.00, 512] # summary: 235 layers, 22221056 parameters, 22221040 gradients, 72.732928 GFLOPs
  l: [1.00, 1.00, 512] # summary: 361 layers, 27478528 parameters, 27478512 gradients, 91.818035 GFLOPs
  x: [1.00, 1.50, 512] # summary: 361 layers, 61698592 parameters, 61698576 gradients, 205.411277 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, DepthwiseSeparablePixelShuffleICNR, [2, 3]] # args = [scale, kernel_size]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, DepthwiseSeparablePixelShuffleICNR, [2, 3]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
